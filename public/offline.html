<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#22b884" />
    <title>LibreLayer — Offline</title>
    <style>
      html {
        color-scheme: dark;
        font:
          16px system-ui,
          sans-serif;
        background: #101513;
        color: #eef3f8;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(30rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #35413c;
        border-radius: 0.75rem;
        background: #19201d;
      }
      h1 {
        margin-top: 0;
        font-size: 1.35rem;
      }
      p {
        color: #b9c0ca;
        line-height: 1.55;
      }
      button {
        border: 0;
        border-radius: 0.45rem;
        padding: 0.7rem 1rem;
        color: #07150f;
        background: #2fbd88;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LibreLayer is offline</h1>
      <p>
        Your device-local projects and recovery copies are safe. Reconnect once
        to load the editor, then its working files will remain available for
        later offline starts.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
